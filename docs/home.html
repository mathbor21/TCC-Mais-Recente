<!DOCTYPE html>
<html lang="pt-BR">
<head>
  
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tela Inicial — UNIVAP Chamados</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --azul:       #1a3d6e;
      --azul-medio: #1e5799;
      --azul-claro: #2f80c8;
      --vermelho:   #c8102e;
      --branco:     #ffffff;
      --cinza-bg:   #f0f3f7;
      --cinza-borda:#cdd5df;
      --cinza-texto:#4a5568;
      --ok:         #147d40;
      --warn:       #c28706;
      --erro:       #b3261e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Barlow', sans-serif;
      background: var(--cinza-bg);
      color: var(--azul);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      background: var(--azul);
      padding: 0 20px 0 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 90px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.30);
      position: sticky; top: 0; z-index: 200;
    }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .hamburger {
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      padding: 6px;
      border-radius: 6px;
      transition: background 0.2s;
    }
    .hamburger:hover { background: rgba(255,255,255,0.10); }
    .hamburger span {
      display: block; width: 24px; height: 2.5px;
      background: var(--branco); border-radius: 2px;
      transition: transform 0.3s, opacity 0.3s;
    }
    .logo-area { display: flex; align-items: center; gap: 20px; }
    .logo-area img {
      height: 64px; width: auto;
      filter: brightness(1.8) saturate(0.9);
    }
    .header-divider { width: 1px; height: 48px; background: rgba(255,255,255,0.22); }
    .header-system-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 18px; font-weight: 600;
      color: rgba(255,255,255,0.70);
      letter-spacing: 0.10em; text-transform: uppercase; line-height: 1.35;
    }
    .header-right { display: flex; align-items: center; gap: 20px; }
    .header-user-info { text-align: right; }
    .user-name { font-size: 16px; font-weight: 700; color: var(--branco); }
    .user-role { font-size: 13px; color: rgba(255,255,255,0.55); font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; }
    .btn-header-logout {
      background: transparent;
      border: 1.5px solid rgba(255,255,255,0.30);
      color: rgba(255,255,255,0.85);
      font-family: 'Barlow', sans-serif;
      font-size: 14px; font-weight: 700;
      padding: 9px 22px; border-radius: 6px; cursor: pointer;
      letter-spacing: 0.06em; text-transform: uppercase;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn-header-logout:hover { background: rgba(255,255,255,0.10); border-color: rgba(255,255,255,0.55); }
    .stripe {
      height: 3px;
      background: linear-gradient(to right, var(--vermelho) 0%, var(--vermelho) 28%, var(--azul-claro) 28%);
      position: sticky; top: 90px; z-index: 199;
    }

    /* ── SIDEBAR OVERLAY ── */
    .sidebar-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 300;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s;
    }
    .sidebar-overlay.open { opacity: 1; pointer-events: all; }

    /* ── SIDEBAR ── */
    aside {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: 25vw; min-width: 220px; max-width: 360px;
      background: var(--azul);
      z-index: 400;
      display: flex; flex-direction: column;
      padding: 0;
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
      box-shadow: 4px 0 24px rgba(0,0,0,0.25);
    }
    aside.open { transform: translateX(0); }

    .sidebar-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 24px 20px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }
    .sidebar-brand {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 18px; font-weight: 700;
      color: var(--branco); line-height: 1.3;
      letter-spacing: 0.04em; text-transform: uppercase;
    }
    .sidebar-close {
      background: transparent; border: none; cursor: pointer;
      color: rgba(255,255,255,0.7); font-size: 22px; line-height: 1;
      padding: 4px 8px; border-radius: 4px;
      transition: background 0.2s, color 0.2s;
    }
    .sidebar-close:hover { background: rgba(255,255,255,0.10); color: #fff; }

    .sidebar-session {
      padding: 16px 20px;
      font-size: 13px; color: rgba(255,255,255,0.75);
      border-bottom: 1px solid rgba(255,255,255,0.10);
    }
    .sidebar-session strong { color: var(--branco); display: block; font-size: 14px; margin-bottom: 2px; }

    nav { display: flex; flex-direction: column; gap: 6px; padding: 18px 14px; flex: 1; }
    .nav-link {
      display: block;
      text-decoration: none;
      color: rgba(255,255,255,0.85);
      font-size: 15px; font-weight: 600;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid transparent;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
      letter-spacing: 0.01em;
    }
    .nav-link:hover {
      background: rgba(255,255,255,0.10);
      border-color: rgba(255,255,255,0.18);
      color: var(--branco);
    }
    .nav-link.active {
      background: var(--branco);
      color: var(--azul);
      font-weight: 700;
      border-color: transparent;
    }

    .sidebar-footer { padding: 14px 14px 20px; }
    .btn-logout-sidebar {
      display: block; width: 100%;
      background: rgba(200,16,46,0.20);
      border: 1px solid rgba(255,255,255,0.25);
      color: rgba(255,255,255,0.90);
      font-family: 'Barlow', sans-serif;
      font-size: 14px; font-weight: 700;
      padding: 11px 16px; border-radius: 8px;
      cursor: pointer; text-align: left;
      letter-spacing: 0.02em;
      transition: background 0.2s;
    }
    .btn-logout-sidebar:hover { background: rgba(200,16,46,0.38); }

    /* ── MAIN ── */
    .page-body { flex: 1; }
    main { padding: 32px 36px 48px; max-width: 1200px; }

    .page-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 28px; font-weight: 700;
      color: var(--azul); text-transform: uppercase; letter-spacing: 0.01em;
      margin-bottom: 4px;
    }
    .page-sub { font-size: 13px; color: var(--cinza-texto); margin-bottom: 28px; }
    .section-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 20px; font-weight: 700;
      color: var(--azul); text-transform: uppercase;
      letter-spacing: 0.04em; margin: 32px 0 14px;
    }

    /* ── SALA CARDS ── */
    .salas-wrapper {
      display: flex; gap: 14px;
      overflow-x: auto; padding-bottom: 6px;
    }
    .sala-card {
      min-width: 250px;
      background: var(--branco);
      border: 1px solid var(--cinza-borda);
      border-radius: 12px; padding: 16px;
      box-shadow: 0 4px 14px rgba(20,37,63,0.07);
      border-top: 3px solid var(--azul-claro);
    }
    .sala-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 16px; font-weight: 700;
      color: var(--azul); text-transform: uppercase;
      letter-spacing: 0.04em; margin-bottom: 12px;
    }
    .metric {
      display: flex; justify-content: space-between;
      margin: 7px 0; font-size: 14px; color: var(--cinza-texto);
    }
    .metric strong { color: var(--azul); }
    .p-ruim { color: var(--erro) !important; }
    .p-alerta { color: var(--warn) !important; }
    .p-ok { color: var(--ok) !important; }

    /* ── CHAMADO ITEMS ── */
    .chamados { display: grid; gap: 12px; }
    .chamado-item {
      background: var(--branco);
      border: 1px solid var(--cinza-borda);
      border-radius: 10px; padding: 14px 16px;
      box-shadow: 0 2px 8px rgba(26,61,110,0.05);
    }
    .chamado-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 6px; }
    .chamado-id { font-weight: 700; color: var(--azul); font-size: 15px; }
    .muted { color: var(--cinza-texto); font-size: 13px; margin-top: 6px; }

    .badge {
      border-radius: 999px; padding: 3px 10px;
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .status-aberto    { background: #fff4de; color: #9a6600; border: 1px solid #f2cf8f; }
    .status-andamento { background: #e6f4ff; color: #0c5e9d; border: 1px solid #98c9ef; }
    .status-concluido { background: #e8f9ef; color: #186539; border: 1px solid #9fd7b4; }
    .status-outro     { background: #f2f4f7; color: #4b5563; border: 1px solid #d7dde5; }

    .empty {
      background: var(--branco);
      border: 1px dashed var(--cinza-borda);
      border-radius: 10px; color: var(--cinza-texto); padding: 18px;
      font-size: 14px;
    }

    footer {
      text-align: center; font-size: 12px; color: #9aa5b4;
      padding: 0 0 24px;
    }

    @media (max-width: 600px) {
      header { padding: 0 14px; height: 72px; }
      .logo-area img { height: 48px; }
      .header-system-label { font-size: 14px; }
      .header-user-info { display: none; }
      main { padding: 20px 16px 36px; }
      aside { width: 80vw; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-left">
      <button class="hamburger" id="btn-menu" aria-label="Abrir menu">
        <span></span><span></span><span></span>
      </button>
      <div class="logo-area">
        <img src="imagens/univapPreto.png" alt="UNIVAP" />
        <div class="header-divider"></div>
        <div class="header-system-label">Sistema de<br>Chamados</div>
      </div>
    </div>
    <div class="header-right">
      <div class="header-user-info">
        <div class="user-name" id="header-nome">Carregando...</div>
        <div class="user-role">Professor</div>
      </div>
      <button class="btn-header-logout" id="logout">Sair</button>
    </div>
  </header>
  <div class="stripe"></div>

  <!-- SIDEBAR OVERLAY -->
  <div class="sidebar-overlay" id="overlay"></div>

  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">Sistema de<br>Chamados</div>
      <button class="sidebar-close" id="btn-close-menu" aria-label="Fechar menu">✕</button>
    </div>
    <div class="sidebar-session">
      <strong id="sidebar-nome">Carregando...</strong>
      <span id="sidebar-id"></span>
    </div>
    <nav>
      <a class="nav-link active" href="/ui/home.html">Tela inicial</a>
      <a class="nav-link" href="/chamados/cadastro">Novo chamado</a>
      <a class="nav-link" id="link-coordenador" href="/ui/coordenador-chamados.html" style="display:none;">Painel do coordenador</a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn-logout-sidebar" id="logout-sidebar">Sair do sistema</button>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="page-body">
    <main>
      <div class="page-title">Lobby de Salas</div>
      <p class="page-sub">Visão rápida dos chamados por sala e dos registros mais recentes.</p>

      <div id="salas-wrapper" class="salas-wrapper"></div>

      <div class="section-title">Chamados mais recentes</div>
      <div id="chamados-recentes" class="chamados"></div>
    </main>
  </div>

  <footer>© UNIVAP — Universidade do Vale do Paraíba</footer>

  <script>
    // ── AUTH ──
    const token = localStorage.getItem("authToken");
    const authUser = JSON.parse(localStorage.getItem("authUser") || "null");
    if (!token) window.location.href = "/ui/login.html?redirect=/ui/home.html";

    const usuarioNome = authUser?.funcionario?.name || "Usuário";
    const usuarioId   = authUser?.funcionario?.idFuncionario || "-";
    const ehCoordenador = Boolean(authUser?.funcionario?.coordenador);

    document.getElementById("header-nome").textContent = usuarioNome;
    document.getElementById("sidebar-nome").textContent = usuarioNome;
    document.getElementById("sidebar-id").textContent   = `ID ${usuarioId}`;
    if (ehCoordenador) document.getElementById("link-coordenador").style.display = "block";

    // ── SIDEBAR ──
    const sidebar  = document.getElementById("sidebar");
    const overlay  = document.getElementById("overlay");
    const btnOpen  = document.getElementById("btn-menu");
    const btnClose = document.getElementById("btn-close-menu");

    const openMenu  = () => { sidebar.classList.add("open"); overlay.classList.add("open"); };
    const closeMenu = () => { sidebar.classList.remove("open"); overlay.classList.remove("open"); };

    btnOpen.addEventListener("click", openMenu);
    btnClose.addEventListener("click", closeMenu);
    overlay.addEventListener("click", closeMenu);

    // ── LOGOUT ──
    const doLogout = () => {
      localStorage.removeItem("authToken");
      localStorage.removeItem("authUser");
      window.location.href = "/ui/login.html";
    };
    document.getElementById("logout").addEventListener("click", doLogout);
    document.getElementById("logout-sidebar").addEventListener("click", doLogout);

    // ── DATA ──
    const headers = { Authorization: "Bearer " + token };

    const statusLabel = (status) => {
      const s = Number(status);
      if (s === 1 || s === 0) return { text: "Aberto",       cls: "status-aberto" };
      if (s === 2)            return { text: "Em andamento", cls: "status-andamento" };
      if (s === 3)            return { text: "Concluído",    cls: "status-concluido" };
      return { text: "Indefinido", cls: "status-outro" };
    };
    const emAberto = (status) => [0,1,2].includes(Number(status));
    const STATUS_EQUIPAMENTO = { INATIVO: 0, DISPONIVEL: 1, MANUTENCAO: 2 };

    const normalizarStatusEquipamento = (status) => {
      const s = Number(status);
      if (s === 3) return STATUS_EQUIPAMENTO.DISPONIVEL;
      if ([STATUS_EQUIPAMENTO.INATIVO, STATUS_EQUIPAMENTO.DISPONIVEL, STATUS_EQUIPAMENTO.MANUTENCAO].includes(s)) return s;
      return STATUS_EQUIPAMENTO.DISPONIVEL;
    };

    const statusEquipamentoAtual = (statusEquipamento, chamadosEquipamento) => {
      if (chamadosEquipamento.some((ch) => Number(ch.status) === 2)) return STATUS_EQUIPAMENTO.MANUTENCAO;
      if (chamadosEquipamento.some((ch) => [0, 1].includes(Number(ch.status)))) return STATUS_EQUIPAMENTO.INATIVO;
      if (chamadosEquipamento.some((ch) => Number(ch.status) === 3)) return STATUS_EQUIPAMENTO.DISPONIVEL;
      return normalizarStatusEquipamento(statusEquipamento);
    };

    const mapSala        = (i) => ({ id: Number(i.idSala ?? i.id_sala), nome: i.numeroSala ?? i.numero_sala ?? `Sala ${i.idSala ?? i.id_sala}` });
    const mapEquipamento = (i) => ({ id: Number(i.idEquipamento ?? i.id_equipamento), nome: i.numeroEquipamento ?? i.numero_equipamento ?? `Computador ${i.idEquipamento ?? i.id_equipamento}`, idSala: Number(i.sala?.idSala ?? i.code_sala), status: Number(i.statusEquipamento ?? i.status_equipamento) });
    const mapFuncionario = (i) => ({ id: Number(i.idFuncionario ?? i.id_funcionario), nome: i.nomeFuncionario ?? i.nome_funcionario ?? `Professor ${i.idFuncionario ?? i.id_funcionario}` });
    const mapChamado     = (i) => ({ id: Number(i.idChamado ?? i.id_chamado), idFuncionario: Number(i.funcionario?.idFuncionario ?? i.code_funcionario), idEquipamento: Number(i.equipamento?.idEquipamento ?? i.code_equipamento), defeito: i.defeito ?? "", relato: i.relato ?? "", status: Number(i.statusChamado ?? i.status_conserto), horario: i.horario });
    const metricClass    = (v) => v < 60 ? "p-ruim" : v < 85 ? "p-alerta" : "p-ok";

    const renderSalas = (salas, equipamentos, chamados) => {
      const eqPorId = new Map(equipamentos.map((e) => [e.id, e]));
      const chamadosPorEquipamento = chamados.reduce((mapa, ch) => {
        if (!mapa.has(ch.idEquipamento)) mapa.set(ch.idEquipamento, []);
        mapa.get(ch.idEquipamento).push(ch);
        return mapa;
      }, new Map());
      const wrap = document.getElementById("salas-wrapper");
      if (!salas.length) { wrap.innerHTML = `<div class="empty">Nenhuma sala cadastrada.</div>`; return; }
      wrap.innerHTML = salas.map((sala) => {
        const eqSala = equipamentos.filter((e) => e.idSala === sala.id);
        const chSala = chamados.filter((ch) => { const eq = eqPorId.get(ch.idEquipamento); return eq && eq.idSala === sala.id && emAberto(ch.status); });
        const funcionais = eqSala.filter((eq) => {
          const chamadosEquipamento = chamadosPorEquipamento.get(eq.id) || [];
          const statusAtual = statusEquipamentoAtual(eq.status, chamadosEquipamento);
          return statusAtual === STATUS_EQUIPAMENTO.DISPONIVEL;
        }).length;
        const total = eqSala.length;
        const defeituosos = Math.max(total - funcionais, 0);
        const pct = total > 0 ? Math.round((funcionais / total) * 100) : 100;
        return `<article class="sala-card">
          <div class="sala-title">${sala.nome}</div>
          <div class="metric"><span>Chamados abertos</span><strong>${chSala.length}</strong></div>
          <div class="metric"><span>Equipamentos com defeito</span><strong>${defeituosos}</strong></div>
          <div class="metric"><span>Funcionais</span><strong class="${metricClass(pct)}">${pct}%</strong></div>
        </article>`;
      }).join("");
    };

    const renderRecentes = (chamados, eqPorId, salaPorId, funcPorId) => {
      const el = document.getElementById("chamados-recentes");
      if (!chamados.length) { el.innerHTML = `<div class="empty">Nenhum chamado encontrado.</div>`; return; }
      el.innerHTML = [...chamados]
        .sort((a, b) => new Date(b.horario || 0) - new Date(a.horario || 0))
        .slice(0, 12)
        .map((ch) => {
          const eq   = eqPorId.get(ch.idEquipamento);
          const sala = eq ? salaPorId.get(eq.idSala) : null;
          const func = funcPorId.get(ch.idFuncionario);
          const st   = statusLabel(ch.status);
          return `<article class="chamado-item">
            <div class="chamado-top">
              <div class="chamado-id">Chamado #${ch.id}</div>
              <span class="badge ${st.cls}">${st.text}</span>
            </div>
            <p style="font-size:14px;color:var(--cinza-texto)">${ch.defeito || "Sem descrição"}</p>
            <div class="muted">Sala: ${sala?.nome || "-"} • Equipamento: ${eq?.nome || "-"} • Professor: ${func?.nome || "-"}</div>
          </article>`;
        }).join("");
    };

    (async () => {
      try {
        const [sR, eR, cR, fR] = await Promise.all([
          fetch("/salas",        { headers }),
          fetch("/equipamentos", { headers }),
          fetch("/chamados",     { headers }),
          fetch("/funcionarios", { headers }),
        ]);
        const [sD, eD, cD, fD] = await Promise.all([sR.json(), eR.json(), cR.json(), fR.json()]);
        if (!sR.ok || !eR.ok || !cR.ok || !fR.ok) throw new Error("Falha ao carregar dados do painel.");

        const salas        = (sD?.data?.salas        || []).map(mapSala).filter((s) => Number.isInteger(s.id));
        const equipamentos = (eD?.data?.equipamentos || []).map(mapEquipamento).filter((e) => Number.isInteger(e.id));
        const chamados     = (cD?.data?.chamados     || []).map(mapChamado).filter((c) => Number.isInteger(c.id));
        const funcionarios = (fD?.data?.funcionarios || []).map(mapFuncionario).filter((f) => Number.isInteger(f.id));

        const eqPorId   = new Map(equipamentos.map((e) => [e.id, e]));
        const salaPorId = new Map(salas.map((s) => [s.id, s]));
        const funcPorId = new Map(funcionarios.map((f) => [f.id, f]));

        renderSalas(salas, equipamentos, chamados);
        renderRecentes(chamados, eqPorId, salaPorId, funcPorId);
      } catch (error) {
        document.getElementById("salas-wrapper").innerHTML = `<div class="empty">${error.message}</div>`;
      }
    })();
  </script>
</body>
</html>
